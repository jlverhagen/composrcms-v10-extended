name: Publish ComposrCMS Extended

on:
  workflow_dispatch:
    inputs:
      core_commit:
        description: Full SHA of a reviewed commit on release
        required: true
        type: string
      version:
        description: Calendar release version, for example 2026.11.1-alpha.4
        required: true
        type: string
      publish:
        description: Publish immediately (otherwise create a draft)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: core-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Validate release inputs
        env:
          CORE_COMMIT: ${{ inputs.core_commit }}
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$CORE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$VERSION" =~ ^[1-9][0-9]{3}\.(0[1-9]|1[0-2])\.[1-9][0-9]*(-(alpha|beta|rc)\.[1-9][0-9]*)?$ ]]
      - uses: actions/checkout@v4
        with:
          ref: release
          path: core
          fetch-depth: 0
          persist-credentials: false
      - name: Select reviewed release commit
        env:
          CORE_COMMIT: ${{ inputs.core_commit }}
        run: |
          git -C core merge-base --is-ancestor "$CORE_COMMIT" HEAD
          git -C core checkout --detach "$CORE_COMMIT"
      - uses: actions/checkout@v4
        with:
          repository: jlverhagen/composrcms-v10-extended-hub
          ref: 9d39ac94566e293377722db00c3dfae8a25de64f
          path: hub
          persist-credentials: false
      - name: Build and verify installers
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python3 hub/hub/publisher/build_composr_installers.py --source-dir core --output-dir packages --version "$VERSION"
          (cd packages && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: composr-installers
          path: packages/
          if-no-files-found: error

  release:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: composr-installers
          path: packages
      - name: Verify and create release
        env:
          GH_TOKEN: ${{ github.token }}
          CORE_COMMIT: ${{ inputs.core_commit }}
          VERSION: ${{ inputs.version }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          (cd packages && sha256sum -c SHA256SUMS)
          existing_tag=$(git ls-remote --tags "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/$VERSION")
          if [[ -n "$existing_tag" ]]; then
            echo "Release tag already exists: $VERSION" >&2
            exit 1
          fi
          flags=()
          if [[ "$VERSION" == *-* ]]; then flags+=(--prerelease); fi
          if [[ "$PUBLISH" != true ]]; then flags+=(--draft); fi
          gh release create "$VERSION" packages/* --repo "$GITHUB_REPOSITORY" \
            --target "$CORE_COMMIT" --title "ComposrCMS v$VERSION" --generate-notes "${flags[@]}"
